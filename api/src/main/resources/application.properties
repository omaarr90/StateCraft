quarkus.application.name=statecraft-api
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=256K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${STATECRAFT_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://statecraft-quantum-lab.omar-alshammary.chatgpt.site,https://state-craft.omaarr90.com}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.info-title=Statecraft Simulator API
quarkus.smallrye-openapi.info-version=1.0.0
statecraft.api-token=${STATECRAFT_API_TOKEN:}
statecraft.max-concurrent=${STATECRAFT_MAX_CONCURRENT:4}
